services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agri_smart
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/agri_smart
      SECRET_KEY: change-me
      WEATHER_API_KEY: ""
    ports: ["8000:8000"]
    depends_on: [postgres]
volumes:
  pgdata:
